name: Refresh Google Places coordinates

on:
  schedule:
    # Semanal, con el script refrescando solo registros de 23+ días.
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Refresh stale coordinates
        run: npm run refresh-google-places

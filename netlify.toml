[build]
  command = "npm ci --prefix client && npm ci --prefix server && npm run build --prefix client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "server/netlify/functions"
  node_bundler = "esbuild"

# SPA: sin esto, refrescar cualquier ruta que no sea "/" da 404 en
# Netlify porque no hay archivos físicos para esas rutas — todo el
# routing lo maneja React en el cliente.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
